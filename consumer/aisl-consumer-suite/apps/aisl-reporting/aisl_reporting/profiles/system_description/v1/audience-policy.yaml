business:
  purpose: Объяснить назначение, практическую ценность, функциональные области, данные и внешние границы понятным бизнес-языком.
  opening_contract:
    heading: О системе
    placement: Перед всеми нумерованными разделами отчёта.
    length: 4–6 связных абзацев, ориентировочно 200–350 слов для detail_level=standard.
    content:
      - роль системы и практический смысл для бизнеса
      - основные задачи, которые поддерживает компонент
      - ключевые группы информации, с которыми он работает
      - характер взаимодействия со смежными системами без перечисления технических контрактов
      - одна краткая оговорка о неподтверждённых аспектах в последнем абзаце
    forbidden:
      - evidence IDs и file:line ссылки
      - имена классов, методов и внутренние interface/scenario identifiers
      - подробные числа gaps и диагностические категории анализатора
      - англоязычный служебный жаргон вроде scope, observed_partial_journey и declared dependency
      - списки технических endpoint/topic/property keys
  emphasis:
    - назначение и роль компонента
    - функциональные области
    - ключевые сценарии
    - внешние взаимодействия
    - основные группы данных
    - ограничения и вопросы владельцу
  deemphasis:
    - полный каталог зависимостей
    - внутренние служебные классы
    - низкоуровневые детали конфигурации
  evidence_presentation: В разделе «О системе» evidence и file:line не показываются; далее ссылки сохраняются как подтверждение и не должны разрушать связность текста.
  preferred_opening: Сначала самостоятельное бизнес-описание системы, затем краткий вывод и технические доказательства.

architecture:
  purpose: Показать границы, модули, интерфейсы, интеграции, хранилища, сценарии и архитектурные ограничения.
  emphasis:
    - системные границы
    - модульная структура
    - REST, Kafka и HTTP
    - хранилища и связи
    - репрезентативные journeys
    - диаграммы
    - coverage и gaps
  deemphasis:
    - перечисление каждого класса без архитектурной роли
  evidence_presentation: Для ключевых выводов указывать evidence ID и file:line provenance.
  preferred_opening: Сначала границы и архитектурная роль, затем сценарии и реализация.

engineering:
  purpose: Дать технически подробное, проверяемое описание реализации и точек входа для дальнейшего разбора.
  emphasis:
    - exact identifiers
    - операции и payloads
    - таблицы и relationships
    - исходные файлы и строки
    - технические journeys
    - конфигурационные привязки
    - пробелы статического анализа
  deemphasis:
    - неподтверждённые бизнес-обобщения
  evidence_presentation: Показывать evidence ID, путь и строки для всех репрезентативных технических утверждений.
  preferred_opening: Сначала технический scope и наблюдаемые контракты, затем интерпретация.
