report_type: workspace-interaction
version: v1
audiences:
- business
- architecture
- engineering
questions:
- Which systems interact through observed outbound-to-inbound boundaries?
- Which business operations and data groups cross those boundaries?
- Which interactions are confirmed, probable, ambiguous, or unresolved?
- Which architecture conclusions are facts and which remain interpretations?
