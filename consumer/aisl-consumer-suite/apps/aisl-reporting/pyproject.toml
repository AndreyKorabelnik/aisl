[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-reporting"
version = "0.4.3"
description = "Deterministic evidence-grounded reports over published Knowledge API revisions"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.2",
  "rich>=13.0.0",
  "PyYAML>=6.0",
  "jsonschema>=4.18.0",
  "aisl-sdk>=0.3.0,<0.4.0",
  "httpx[http2]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aisl-reporting = "aisl_reporting.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_reporting*"]

[tool.setuptools.package-data]
aisl_reporting = ["profiles/**/*.yaml", "profiles/**/*.json", "profiles/**/*.md"]
