[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-cli"
version = "0.2.0"
description = "Generic command-line consumer for published AISL knowledge"
requires-python = ">=3.10"
dependencies = [
  "aisl-sdk==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aisl = "aisl_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_cli*"]
