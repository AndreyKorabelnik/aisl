[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisl-sdk"
version = "0.3.0"
description = "Public Python client for immutable AISL revisions served by Knowledge API"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aisl_sdk*"]
