[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepared-knowledge-runtime"
version = "0.1.0.post14"
description = "Canonical read-only runtime and query contracts for Prepared Knowledge artifacts"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prepared_knowledge_runtime*"]
