[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "static-analysis-runner"
version = "0.10.28"
description = "Typed evidence and knowledge materialization runtime for static analysis"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
knowledge = ["knowledge-layer-core>=0.50.0,<1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
static-analysis-runner = "static_analysis_runner.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["static_analysis_runner*"]

[tool.setuptools.package-data]
static_analysis_runner = ["resources/*.json"]
