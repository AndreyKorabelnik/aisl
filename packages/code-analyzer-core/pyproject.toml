[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analyzer-core"
version = "0.44.23a7"
description = "Machine-first Java, Python and SQL static analyzer with evidence access API"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.2",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "sqlglot>=20.0.0",
  "networkx>=3.0",
  "jinja2>=3.1.0",
  "rapidfuzz>=3.0.0",
  "rich>=13.0.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-java>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
code-analyzer-core = "code_analyzer_core.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_analyzer_core*", "code_evidence*"]



[tool.setuptools.package-data]
code_evidence = ["resources/*.json"]
code_analyzer_core = ["resources/*.json"]
